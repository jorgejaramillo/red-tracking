  consent_records: Se guardan las coordenadas estimadas de tu mirada y capturas de pantalla de la página del estudio.
  consent_not_records: NUNCA se guarda ni se envía el video de tu cámara. El análisis de la cara ocurre solo en tu equipo.
  consent_scope: La grabación se limita al sitio web del estudio y se detiene al terminar, al cerrar la pestaña o cuando tú lo decidas.
