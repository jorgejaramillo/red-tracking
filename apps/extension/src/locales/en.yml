onboarding:
  title: Welcome to red-tracking
  intro: This extension uses your webcam to estimate where you look inside a web page during a research study.
  step_consent: Consent
  step_camera: Camera
  step_check: Check
  step_ready: Ready
  consent_title: What is recorded and what is not
  consent_records: Estimated gaze coordinates and screenshots of the study page are stored.
  consent_not_records: Your camera video is NEVER stored or sent. Face analysis happens only on your device.
  consent_scope: Recording is limited to the study website and stops when the study ends, when you close the tab, or whenever you decide.
  consent_data: At the end you can review the report and decide whether to download or share it.
  consent_accept: I understand and agree to participate
  camera_title: Turn on your camera
  camera_body: Chrome will ask for permission to use the camera. It is only used to detect your eyes on your own device.
